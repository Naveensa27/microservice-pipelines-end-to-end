---
- name: Configure Production Nodes for K3s & Observability
  hosts: k8s_nodes
  become: true
  vars:
    node_exporter_version: "1.8.0"

  tasks:
    - name: Update APT cache & upgrade packages
      apt:
        update_cache: yes
        upgrade: safe

    - name: Install prerequisite packages
      apt:
        name:
          - curl
          - wget
          - apt-transport-https
          - ca-certificates
          - git
        state: present

    - name: Download Node Exporter
      get_url:
        url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
        dest: "/tmp/node_exporter.tar.gz"

    - name: Extract Node Exporter
      unarchive:
        src: "/tmp/node_exporter.tar.gz"
        dest: "/opt/"
        remote_src: yes

    - name: Create systemd unit for Node Exporter
      copy:
        dest: /etc/systemd/system/node_exporter.service
        content: |
          [Unit]
          Description=Prometheus Node Exporter
          After=network.target

          [Service]
          User=nobody
          ExecStart=/opt/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter

          [Install]
          WantedBy=multi-user.target

    - name: Start and enable Node Exporter
      systemd:
        name: node_exporter
        state: started
        enabled: yes

    - name: Install K3s Lightweight Kubernetes
      shell: |
        curl -sfL https://get.k3s.io | sh -s - --write-kubeconfig-mode 644
      args:
        creates: /usr/local/bin/k3s